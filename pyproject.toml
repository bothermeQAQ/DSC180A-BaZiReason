[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bazireason"
version = "0.1.0"
description = "Convention-aware evaluation of Chinese calendrical reasoning"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["lunar-python==1.4.8", "httpx==0.28.1", "tzdata==2026.6"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3", "sxtwl==2.0.7", "pypdf==6.21.4"]

[project.scripts]
bazireason = "bazireason.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
