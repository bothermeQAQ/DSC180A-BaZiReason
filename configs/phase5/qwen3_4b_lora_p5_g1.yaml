# BaZiReason Phase 5, G1: continue from the Phase 4 A1 adapter on p5_train_v1, answering from
# supplied verified facts (routed conclusion or full fact sheet), keeping the verified answer
# on follow-ups, declining predictions, with replay of p4_train_v1 rows against forgetting.
# Motivation (development data): A1 disagrees with a supplied verified conclusion on 31-33% of
# rule questions; a prompt change only moved this to 31% (docs/phase5_log.md).
run_name: bazireason-qwen3-4b-lora-p5-g1
model: models/qwen3-4b-instruct-2507-mlx-4bit
base_model:
  repo: Qwen/Qwen3-4B-Instruct-2507
  revision: cdbee75f17c01a7cc42f958dc650907174af0554
  license: Apache-2.0
  quantization: "mlx_lm convert -q --q-bits 4 --q-group-size 64 (mlx-lm 0.32.2)"
init_adapter: artifacts/adapters/bazireason-qwen3-4b-lora-p4-a1/adapters.safetensors
data:
  train: data/phase5/train_v1/train.jsonl
  valid: data/phase5/train_v1/valid.jsonl
  valid_rows: 100
adapter_dir: artifacts/adapters/bazireason-qwen3-4b-lora-p5-g1
log_dir: results/phase5/training/bazireason-qwen3-4b-lora-p5-g1
seed: 20261116
fine_tune_type: lora
num_layers: 16
lora_parameters:
  rank: 16
  scale: 2.0
  dropout: 0.05
optimizer: adamw
weight_decay: 0.01
learning_rate: 5.0e-5      # as A1: a corrective continuation of a trained adapter
warmup_updates: 20
end_learning_rate: 5.0e-6
batch_size: 2
grad_accumulation_steps: 2
epochs: 1.0
max_seq_length: 2048       # longest row is 1,990 tokens; no target is truncated
steps_per_report: 20
steps_per_eval: 500
steps_per_save: 500
mask_prompt: true
enable_thinking: false
