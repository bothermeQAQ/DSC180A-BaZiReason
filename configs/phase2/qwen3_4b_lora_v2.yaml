# BaZiReason Phase 2, second round: warm start from the selected v1 adapter, new data.
# Motivation and data changes: docs/phase2_progress_report.md, section "Second round".
run_name: bazireason-qwen3-4b-lora-v2
model: models/qwen3-4b-instruct-2507-mlx-4bit
base_model:
  repo: Qwen/Qwen3-4B-Instruct-2507
  revision: cdbee75f17c01a7cc42f958dc650907174af0554
  license: Apache-2.0
  quantization: "mlx_lm convert -q --q-bits 4 --q-group-size 64 (mlx-lm 0.32.2)"
init_adapter: artifacts/adapters/bazireason-qwen3-4b-lora-v1/adapters.safetensors
data:
  train: data/phase2/train_v2/train.jsonl
  valid: data/phase2/train_v2/valid.jsonl
  valid_rows: 120
adapter_dir: artifacts/adapters/bazireason-qwen3-4b-lora-v2
log_dir: results/phase2/training/bazireason-qwen3-4b-lora-v2
seed: 20261111
fine_tune_type: lora
num_layers: 16
lora_parameters:
  rank: 16
  scale: 2.0
  dropout: 0.05
optimizer: adamw
weight_decay: 0.01
learning_rate: 1.0e-4      # half the first round's peak: the adapter is already trained
warmup_updates: 20
end_learning_rate: 1.0e-5
batch_size: 2
grad_accumulation_steps: 2
epochs: 1.0
max_seq_length: 1920
steps_per_report: 20
steps_per_eval: 250
steps_per_save: 250
mask_prompt: true
enable_thinking: false
