# BaZiReason Phase 2: QLoRA on a 4-bit Qwen3-4B-Instruct-2507, Apple M5 with 32 GB.
run_name: bazireason-qwen3-4b-lora-v1
model: models/qwen3-4b-instruct-2507-mlx-4bit
base_model:
  repo: Qwen/Qwen3-4B-Instruct-2507
  revision: cdbee75f17c01a7cc42f958dc650907174af0554
  license: Apache-2.0
  quantization: "mlx_lm convert -q --q-bits 4 --q-group-size 64 (mlx-lm 0.32.2)"
data:
  train: data/phase2/train_v1/train.jsonl
  valid: data/phase2/train_v1/valid.jsonl
  valid_rows: 120          # fixed, family-stratified subset used for checkpoint selection
adapter_dir: artifacts/adapters/bazireason-qwen3-4b-lora-v1
log_dir: results/phase2/training/bazireason-qwen3-4b-lora-v1
seed: 20261110
fine_tune_type: lora
num_layers: 16             # last 16 of 36 transformer blocks
lora_parameters:
  rank: 16
  scale: 2.0               # mlx-lm multiplies the update by `scale` (alpha / rank = 32 / 16)
  dropout: 0.05
optimizer: adamw
weight_decay: 0.01
learning_rate: 2.0e-4
warmup_updates: 40
end_learning_rate: 2.0e-5
batch_size: 2
grad_accumulation_steps: 2  # effective batch of 4 sequences per optimizer update
epochs: 1.0
max_seq_length: 1920
steps_per_report: 20
steps_per_eval: 250
steps_per_save: 250
mask_prompt: true          # loss on the assistant completion only
enable_thinking: false
