# BaZiReason Phase 6, u3v: u3 with derivation version 2 (round 2, the fork of preregistration 10.5)
# Continues bazireason-qwen3-4b-lora-p6-u2 (its files are not modified). Data: scripts/phase6/build_train6.py.
run_name: bazireason-qwen3-4b-lora-p6-u3v
model: models/qwen3-4b-instruct-2507-mlx-4bit
base_model:
  repo: Qwen/Qwen3-4B-Instruct-2507
  revision: cdbee75f17c01a7cc42f958dc650907174af0554
  license: Apache-2.0
  quantization: "mlx_lm convert -q --q-bits 4 --q-group-size 64 (mlx-lm 0.32.2)"
data:
  train: data/phase6/train/u3v/train.jsonl
  valid: data/phase6/train/u3v/valid.jsonl
  valid_rows: 120
adapter_dir: artifacts/adapters/bazireason-qwen3-4b-lora-p6-u3v
log_dir: results/phase6/training/bazireason-qwen3-4b-lora-p6-u3v
seed: 2026111716
fine_tune_type: lora
num_layers: 16
lora_parameters:
  rank: 16
  scale: 2.0
  dropout: 0.05
optimizer: adamw
weight_decay: 0.01
learning_rate: 1.0e-4      # a continuation: half the first-round rate
warmup_updates: 40
end_learning_rate: 1.0e-5
batch_size: 2
grad_accumulation_steps: 2
epochs: 1.0
max_seq_length: 2048
steps_per_report: 20
steps_per_eval: 500
steps_per_save: 500
mask_prompt: true
enable_thinking: false
init_adapter: artifacts/adapters/bazireason-qwen3-4b-lora-p6-u2/adapters.safetensors
