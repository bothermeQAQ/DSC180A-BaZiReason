# BaZiReason Phase 3, round 1: warm start from the selected Phase 2 adapter (v2) on p3_train_v1.
# Motivation and data design: docs/phase3_progress_report.md.
run_name: bazireason-qwen3-4b-lora-p3-r1
model: models/qwen3-4b-instruct-2507-mlx-4bit
base_model:
  repo: Qwen/Qwen3-4B-Instruct-2507
  revision: cdbee75f17c01a7cc42f958dc650907174af0554
  license: Apache-2.0
  quantization: "mlx_lm convert -q --q-bits 4 --q-group-size 64 (mlx-lm 0.32.2)"
init_adapter: artifacts/adapters/bazireason-qwen3-4b-lora-v2/adapters.safetensors
data:
  train: data/phase3/train_v1/train.jsonl
  valid: data/phase3/train_v1/valid.jsonl
  valid_rows: 150
adapter_dir: artifacts/adapters/bazireason-qwen3-4b-lora-p3-r1
log_dir: results/phase3/training/bazireason-qwen3-4b-lora-p3-r1
seed: 20261112
fine_tune_type: lora
num_layers: 16
lora_parameters:
  rank: 16
  scale: 2.0
  dropout: 0.05
optimizer: adamw
weight_decay: 0.01
learning_rate: 1.0e-4      # same peak as the Phase 2 warm-start round
warmup_updates: 20
end_learning_rate: 1.0e-5
batch_size: 2
grad_accumulation_steps: 2
epochs: 1.0
max_seq_length: 1920
steps_per_report: 20
steps_per_eval: 500
steps_per_save: 500
mask_prompt: true
enable_thinking: false
